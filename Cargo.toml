[package]
name = "lazykafka"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
flate2 = "1.1.11"
lz4_flex = "0.14.0"
ratatui = "0.29.0"
ruzstd = "0.9.1"
serde_json = "1.0"
snap = "1.1.2"
socket2 = "0.5"
tokio = { version = "1.48", features = ["full"] }
unicode-width = "0.2"

[dev-dependencies]
tokio-test = "0.4"  # For testing async code
